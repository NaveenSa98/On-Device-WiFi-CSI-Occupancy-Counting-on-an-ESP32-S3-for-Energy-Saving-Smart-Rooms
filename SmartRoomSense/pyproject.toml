[project]
name = "smartroomsense"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=2.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyserial>=3.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tensorflow>=2.21.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
